# ddflow is a VENDORED, self-contained package: it ships as a directory you copy into
# any project, and it carries its own conventions rather than inheriting the host
# repository's. Ruff resolves configuration per file from the nearest config in that
# file's ancestor directories, so this file governs `ddflow/` and nothing else.
#
# The rule set is the host repo's, minus four exemptions. Each is written down, because
# an undocumented ignore is how a lint config becomes a place to hide problems.

line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "B", "C4", "C90", "I", "UP", "PL", "RUF"]
ignore = [
    # Long explanatory comments are deliberate here; the reasoning behind a
    # coordination rule is the part that stops the next reader "simplifying" it away.
    "E501",
    # Deferred imports are LOad-bearing in this package: `events` derives its
    # vocabulary from `model`, which imports `events`; `lease` calls into `schedule`;
    # `render` calls into `gates`. Each deferred import breaks a genuine cycle and is
    # commented where it occurs. Hoisting them to the top would not compile.
    "PLC0415",
    # `subprocess.run(check=...)` -- this package deliberately inspects return codes
    # rather than raising, because a non-zero git exit is frequently the ANSWER
    # (is this tree dirty? is that branch ahead?) rather than an error.
    "PLW1510",
]

[lint.per-file-ignores]
# `ddflow/surfaces/cli.py` has NO per-file ignore (B163). It carried
# `["PLR0915", "PLR0912", "C901"]` for `build_parser`, and a per-FILE ignore applies to every
# function that happens to share the file — which for a 4,000-line module was ~45 of them.
# Three were over the complexity limit invisibly for months and were each flagged the moment
# B36 moved them out: `_render_workflow` (17 branches), `cmd_status` (16), `cmd_reviewers`
# (18). All three were split. `build_parser` carries a targeted `# noqa: PLR0915` instead,
# with the argument for it at the call site, so the suppression is exactly as wide as the
# claim.
#
# `Server.handle` is a protocol dispatch table written as a method: one arm per JSON-RPC
# method, each three lines, none reachable from anywhere else. A registry here would be
# indirection without abstraction, and the return count is just the number of methods the
# protocol defines. (This comment was duplicated almost verbatim; one copy.)
"ddflow/surfaces/mcp.py" = ["PLR0912", "C901", "PLR0911"]
# Tests and demos: magic values ARE the test, and a scenario is meant to read top to
# bottom as a narrative rather than be decomposed into helpers.
"tests/*" = ["PLR2004", "PLR0915", "PLR0912", "S101"]
"demos/*" = ["PLR2004", "PLR0915", "PLR0912", "T201"]
"probes/*" = ["PLR2004", "T201", "E402"]
# Demo scenarios shell out constantly and read return codes by hand.
"demos/harness.py" = ["PLW1510", "S603"]

[lint.mccabe]
# The host repository's threshold. A coordination function that enumerates the four
# distinct reasons a claim can be refused is not complex in the sense the metric is
# trying to catch -- it is exhaustive, which is the property we want it to have.
max-complexity = 15

[lint.pylint]
# Functions that thread configuration through take more arguments than the default 5
# allows; the alternative is a parameter object that exists only to satisfy a counter.
max-args = 10
max-statements = 100
max-branches = 18
# Early returns are how the refusal paths in `acquire`, `merge` and `cmd_gate` stay
# readable: each names one reason and leaves. Collapsing them into a single exit would
# require a result variable threaded through every branch.
max-returns = 14

[lint.flake8-bugbear]
# `knob(...)` returns a dataclasses.field() carrying the knob's declaration
# (config_sections/_docs.py), exactly as `field(...)` does: a list default goes in through
# `factory=`, never as a shared instance. Without this, RUF009 reads it as an arbitrary call
# in a dataclass default.
extend-immutable-calls = ["ddflow.config_sections._docs.knob"]
