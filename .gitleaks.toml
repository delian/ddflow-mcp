# gitleaks configuration. The CI job that uses it is in `.github/workflows/ci.yml`.
#
# WHY THIS FILE EXISTS. ddflow redacts credentials out of session prompts before they
# touch the log — `services/sessions.py`, tested by
# `tests/test_store_and_session.py::test_secrets_are_redacted_before_touching_disk` and
# the parametrised cases in `tests/test_critic_findings.py`. A test that proves a
# `ghp_…` token gets redacted has to CONTAIN a `ghp_…` token, so the repository holds
# credential-shaped strings on purpose, and a scanner with no configuration reports
# every one of them.
#
# That matters more than the noise. A secret scanner whose first run is red on its own
# test fixtures is a scanner people learn to skip, and the next finding — the real one —
# arrives in a list they have stopped reading. This project has already committed a live
# API key once; the whole value of the check is that a hit means something.
#
# So the allowlist names the FIXTURE VALUES, one at a time, rather than excluding
# `tests/`. Excluding the directory would hide a real key pasted into a test file, which
# is a normal way for one to arrive — somebody reproduces a bug with their own token.
# Every entry below is a documented example value or obvious filler, and a new one has to
# be added deliberately, which is the point.

[extend]
useDefault = true

[[rules]]
  # A placeholder so `[extend]` above is not the only table; gitleaks requires at least
  # one rule or extend block to parse, and this one can never match.
  id = "ddflow-never-matches"
  description = "Inert. See the header: configuration lives in [[allowlists]]."
  regex = '''\$\^ddflow-inert-never-matches\$'''

[[allowlists]]
  description = "Fixture credentials for ddflow's own redaction tests"
  # Named values, not paths. Each is either a documented vendor example or plainly filler.
  regexes = [
    # AWS's own documentation example key. Appears in every AWS tutorial ever written.
    '''AKIAIOSFODNN7EXAMPLE''',
    # Sequential-alphabet filler: the string itself is the proof it is not real.
    '''ghp_abcdefghijklmnopqrst''',
    '''sk-abcdefghijklmnop1234''',
    '''abcdefghijklmnopqrstuvwxyz123456''',
    '''xoxb-1234567890-abcdef''',
    # A joke from xkcd 936, used as the "password:" case.
    '''hunter2hunter2''',
    # ddflow's own split-slice item ids ("B-uni-record-surface.2-surface"): the event log
    # names them in task bodies, and the generic-api-key rule reads one that follows an
    # `api` word as the key. The `.N-` slice part is what no credential format has.
    '''^[A-Za-z]+(?:-[A-Za-z0-9]+)+\.[0-9]+(?:-[A-Za-z0-9]+)+[.,;:]?$''',
    # ddflow's own decision id that follows the `auth-token` inside its neighbour
    # `D-auth-token-defaults` in a recorded-decision list: a specific value, not the id
    # shape, because no regex separates a decision slug from a credential shape safely.
    '''^D-swarm-pilot-2026-11-05[.,;:]?$''',
  ]
  # The context7 key that leaked into the PARENT repository is deliberately NOT listed.
  # It does not appear in ddflow's history, and if it ever does, this scan must fire.

[[allowlists]]
  # The sourcegraph-access-token rule takes any bare 40-hex string as a token once the word
  # "sourcegraph" appears anywhere in the scanned diff (its keyword prefilter is per file,
  # not per match). The committed event logs name git commit shas and diff digests (40 hex)
  # constantly, and one log mentioned sourcegraph in a task body: 16 false positives.
  # Scoped to ONE rule, ONLY the event logs, ONLY a bare 40-hex value; a real `sgp_`-prefixed
  # token, or the same rule in any other file, still fires.
  description = "40-hex git shas in the committed event logs are not sourcegraph tokens"
  targetRules = ["sourcegraph-access-token"]
  condition = "AND"
  paths = ['''^\.ddflow/events/[^/]+\.jsonl$''']
  regexes = ['''^[0-9a-f]{40}$''']


[[allowlists]]
  # The committed docs quote git commit shas too (RESEARCH.md reproduces a `ddflow ci run`
  # that names one), and mention sourcegraph elsewhere in the same file: the rule's keyword
  # prefilter is per file, so the sha reads as a token. Scoped to ONE rule, ONLY the
  # committed docs, ONLY a bare 40-hex value: a real `sgp_`-prefixed token, or a bare hex
  # string outside `docs/`, still fires.
  description = "40-hex git shas in the committed docs are not sourcegraph tokens"
  targetRules = ["sourcegraph-access-token"]
  condition = "AND"
  paths = ['''^docs/''']
  regexes = ['''^[0-9a-f]{40}$''']

[[allowlists]]
  # [session].redact_patterns holds the REGEX that masks a PEM block, and an upgrade note about
  # that knob quotes its value: `PRIVATE KEY-----.*?-----END`, a wildcard where a real key has
  # its base64 body. Scoped to ONE rule, ONLY the upgrade notes, ONLY that literal source text:
  # a real key in those files, or the same rule in any other file, still fires.
  description = "the PEM redaction regex quoted in an upgrade note is not a private key"
  targetRules = ["private-key"]
  condition = "AND"
  paths = ['''^ddflow/templates/upgrade/''']
  regexes = ['''PRIVATE KEY-----\.\*\?-----END''']

[[allowlists]]
  # The now-REVOKED Gemini API key sits unredacted in one committed event-log shard line
  # (the bridge-cse session shard, commit 1deb264357; the history rewrite did not move it
  # — bug B5dc280b4eb). Google now answers 403 "API key was reported as leaked" for it, so
  # the value is dead, not live. Scoped to exactly this value, exactly the gcp-api-key
  # rule, exactly the event-log shard files: a live `AIza` key anywhere else still fires.
  description = "REVOKED Gemini API key in a committed event-log shard (Google 403: reported as leaked)"
  targetRules = ["gcp-api-key"]
  condition = "AND"
  paths = ['''^\.ddflow/events/[^/]+\.jsonl$''']
  regexes = ['''^AIzaSyAuEm-JafbL8U6TborcDo8jc9DScUJ8E_s$''']

[[allowlists]]
  # The lane-launch/opencode tests name a fake `sk-` credential to prove a real one is
  # redacted out of harness output. `sk-test-0123456789abcdef` is obvious filler (the
  # `sk-test-` prefix says so); named per value, not per path, so a real `sk-…` key in a
  # test file still fires.
  description = "Fake sk- fixture value in the lane-launch/opencode tests"
  regexes = ['''^sk-test-0123456789abcdef$''']

[[allowlists]]
  # A critic finding in the fix-Bsecbug-redact-google-api-key event shard quotes the
  # synthetic example `key = 1234567890Abcdefghij` (sequential digits, then sequential
  # alphabet) while arguing the redaction shape must also match the plain name `key`.
  # Unmistakably filler; named per value, so a real key captured the same way still fires.
  description = "Sequential-filler example key quoted in a committed event-log critic finding"
  regexes = ['''^1234567890Abcdefghij$''']
