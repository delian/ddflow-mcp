# ddflow ships as a normal Python distribution so that adopting it is ONE line in an
# agent's MCP config and nothing else:
#
#     {"mcpServers": {"ddflow": {"command": "uvx", "args": ["ddflow-mcp"]}}}
#
# `uvx` fetches and runs it in an ephemeral environment on first use. No clone, no
# PYTHONPATH, no install step for the operator to forget and no vendored copy to drift
# from upstream. That is the whole reason this file exists: a workflow distributed as
# "copy these scripts into your repo" is a workflow that is a different version in
# every repo within a month.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The version is declared ONCE, as `__version__ = "X.Y.Z"` in ddflow/__init__.py. The wheel
# takes it from there; uv.lock therefore records no version for this project, so a bump
# never makes the lock stale. server.json is rendered from server.template.json by
# scripts/render_server_json.py; scripts/bump.sh does both.
[tool.hatch.version]
path = "ddflow/__init__.py"

[project]
name = "ddflow-mcp"
dynamic = ["version"]   # ddflow/__init__.py is the one place the version is declared (hatch reads it, below)
description = "A portable, agent-agnostic work-queue kernel for AI coding agents — MCP server and CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["mcp", "model-context-protocol", "agents", "workflow", "task-queue",
            "git-worktree", "code-review", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]

# ONE dependency, and the reason it is here is a bug, not a convenience.
#
# This list was empty on purpose: the standard library plus `git` is what makes ddflow
# installable everywhere an agent runs -- sandboxes with no reachable package index, CI
# images, the inside of another tool's ephemeral container. The MCP stdio transport is
# newline-delimited JSON-RPC and is implemented here rather than taken as a dependency;
# see docs/ARCHITECTURE.md. That property is still real and still worth having.
#
# What it cost: prompts are Jinja2 templates, and `services/prompts.py` carries a
# fallback renderer for when Jinja2 is absent. Two engines, one of them untested,
# because every developer's ambient interpreter had Jinja2 and the project venv did
# not -- so `python -m pytest` was green and `uv run pytest` was red on the same
# commit. 0.1.1 shipped a handshake that rendered correctly for the people who wrote it
# and, for every unadopted repository, produced:
#
#     ddflow's instruction template could not be loaded: template variable
#     'actionable_companions' is not defined
#
# Declaring it makes the language the templates are written in the language that is
# actually installed. The fallback stays — it is what a stripped deployment falls back
# to — but it is now a tested, LOUD degraded path rather than an invisible second
# implementation. `tests/test_template_engines.py` runs the suite through both.
dependencies = [
    "jinja2>=3.1.6",
]

[project.scripts]
# Two entry points on purpose. `ddflow` is the human/CI surface; `ddflow-mcp` is what
# an MCP client spawns, so the client's config never has to carry a subcommand.
ddflow = "ddflow.surfaces.cli:main"
ddflow-mcp = "ddflow.surfaces.mcp:main"

[project.urls]
Homepage = "https://github.com/delian/ddflow-mcp"
Repository = "https://github.com/delian/ddflow-mcp"
Issues = "https://github.com/delian/ddflow-mcp/issues"

[project.optional-dependencies]
search = [
    "rapidfuzz>=3.14.6",
]
watch = [
    "watchfiles>=1.3.0",
]
rag = [
    "model2vec>=0.9.0",
    "sqlite-vec>=0.1.9",
]
mcp-sdk = [
    "mcp>=2.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ddflow"]

[tool.hatch.build.targets.sdist]
include = ["ddflow/", "docs/", "tests/", "demos/", "probes/", ".importlinter",
           "README.md", "server.json", "LICENSE"]

# Templates need no force-include: they live under `ddflow/`, and hatchling ships
# every file in a declared package directory. They were a SIBLING directory until a
# real install raised FileNotFoundError for them -- a fault invisible from a source
# checkout, which is why `tests/test_packaging.py` builds the wheel and looks inside.

[tool.pytest.ini_options]
# `slow` marks the end-to-end scenarios: real processes, real worktrees, real test runs
# inside them. Deselected by default so the ordinary suite stays a thing people run;
# `-m slow` opts in, and CI runs them as their own job.
#
# Registered here rather than left implicit because an unregistered marker is silently
# a typo: `@pytest.mark.slwo` selects nothing and warns, and a test nobody selects is a
# test nobody runs.
markers = [
    "slow: end-to-end scenarios; minutes, not seconds",
    # Selects the scenarios alone among the slow tests, so the pre-push hook can run them in
    # ONE pytest session with the unit tests: `-m "not slow or scenarios"`.
    "scenarios: the end-to-end scenarios in tests/test_scenarios.py",
]
addopts = "-m 'not slow'"

# The dev toolchain, declared ONCE and here rather than as a `[project.optional-
# dependencies]` extra, because `uv run` and `uv sync` install this group by default
# and an extra has to be asked for. That difference is the whole point: every CI job
# and `scripts/release.sh` used to reach for `uv run --with pytest --with
# pytest-timeout`, which is an ad-hoc install of an undeclared, unpinned, unlocked
# tool at the moment of use -- a second dependency list that no lockfile covers and
# nothing keeps in step with this one.
#
# `uv add --dev <pkg>`, never `uv pip install`: the first writes this block AND
# `uv.lock`, so a fresh clone reproduces the versions the suite last passed on.
[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "import-linter>=2.15",
    "networkx>=3.6.1",
    "pylint>=4.1.2",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "radon>=6.0.1",
    "ruff>=0.16.9",
    "syrupy>=6.1.1",
]
