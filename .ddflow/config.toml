# ddflow configuration — everything in one file.
# `ddflow config --explain` documents every knob. Only what you change needs to be
# here; everything else keeps its default.

# ---------------------------------------------------------------------------------
# THE ONE THING YOU MUST SET: how this project runs its tests.
# ---------------------------------------------------------------------------------
# [gate.unit_tests]
# command = "pytest -q"     # or "npm test" · "cargo test" · "go test ./..." · "make check"
#
# Set it with:   ddflow config --set gate.unit_tests.command "pytest -q"
# Until it is set, the unit_tests gate reports UNAVAILABLE — which is honest, and
# blocks completion, rather than passing vacuously.
#
# Left COMMENTED on purpose: an empty table here would collide with the block that
# `ddflow config --append-toml` writes, since TOML forbids a duplicate table, and the
# documented way to configure the project would fail on a fresh install.

# ---------------------------------------------------------------------------------
# A cross-family reviewer makes the `critic` gate real rather than self-reported.
# `ddflow reviewers detect --write` finds a local model server and fills this in.
# ---------------------------------------------------------------------------------
# [[reviewer]]
# name     = "local"
# base_url = "http://127.0.0.1:11434/v1"
# model    = "qwen3:8b"
# family   = "alibaba"            # must differ from the authoring model's family
# gates    = ["critic"]
# api_key_env = "MY_API_KEY"      # the NAME of an env var, never the key itself

[lease]
ttl_s = 1800            # how long a claim survives without a heartbeat
heartbeat_s = 300

[worktree]
enabled = true
max_parallel = 4

# .roborev.toml is git-ignored (decision D-roborev-local) but roborev reads it from each
# checkout, so every worktree ddflow creates gets the primary's copy.
# A tree whose ddflow predates this knob skips it with a warning (B9cb7dd1c3b); one that
# predates 81a52e3 refuses the whole config until it merges main.
local_files = [".roborev.toml"]

[schedule]
max_parallel_tasks = 4

[enforce]
# "block" makes the pre-commit hook REFUSE a commit touching paths no lease of yours
# covers — the only layer of this workflow that does not rely on the agent agreeing.
# Starts at "warn" so adopting ddflow never breaks an existing repo on day one.
commit_without_lease = "warn"
# Operator 2026-09-29 (decision D-strip-coauthor-history): no commit in this
# repository credits a tool. The commit-msg hook refuses it for every agent.
forbidden_trailers = ["Co-Authored-By"]

[session]
brief_max_tokens = 1200

[gate.unit_tests]
# In parallel (pytest-xdist): one worker per core, capped at 16 -- several agents may run
# this gate at once, and on a large host `-n auto` alone would start one worker per core
# for EACH of them. A machine that wants a different count sets it in its own
# git-ignored .ddflow/gates.toml.
command = "uv run pytest tests/ -q --timeout=420 -n auto --maxprocesses 16"

# This project's reviewers (the cross-family critic) are NOT committed: an endpoint, a
# model name and an API-key variable belong to whoever runs the project. Put yours in
# the git-ignored .ddflow/reviewers.toml, e.g.
#   [[reviewer]]
#   name = "my-critic"
#   base_url = "http://127.0.0.1:8000/v1"
#   model = "<served model name>"
#   family = "<its pretraining family>"
#   gates = ["critic"]
# `ddflow reviewers detect` finds local endpoints and prints the block.
