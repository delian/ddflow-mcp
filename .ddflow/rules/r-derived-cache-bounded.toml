Bug Bece55b8a77, D-scale-answers. RULE: a snapshot, checkpoint, index or sidecar is derived, local and rebuildable from the log; it carries an explicit schema/fold-revision fingerprint (not a source hash), a size or count cap, a GC policy, a kill switch and a documented rollback (delete the file); an unknown format is ignored, never trusted. Extends r-derive-dont-store. CHECK: PS-index-cap, PS-state-checkpoint equivalence test. VERIFY: what bounds its disk size and how do I turn it off?