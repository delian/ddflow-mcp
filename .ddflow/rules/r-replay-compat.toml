id = "r-replay-compat"
title = "The event log is never rewritten; old logs always replay; new event kinds are additive"
tags = ["architecture", "data"]
scope = "project"
priority = 100
globs = ["ddflow/core/**"]
created = "2026-11-03T14:12:34.719828+00:00"
