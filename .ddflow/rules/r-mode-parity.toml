R-mode-parity 5, D-mode-parity-answers; adds to r-no-shell and r-external-frontends. RULE: every declared command declares its needs (log, tree, shell, secret, person); a command may be unavailable in a mode only with a recorded reason and a fallback (a run-yourself envelope or a chat route). CHECK: the generated feature x mode matrix test (MP-matrix) fails on an undeclared command or an empty fallback. VERIFY: in which modes does this command work and what does it say where it cannot?