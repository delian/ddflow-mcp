RULE: never ask what ddflow can derive or what an existing decision answers; batch related questions; give each option a recommended default and its consequence; relay approvals as ddflow approvals ask prints them, unaltered; record every answer as a decision with its context and alternatives; person-only acts (acceptance, go/no-go, risk acceptance, release, config of approvals) are never decided by an agent. CHECK: decide tasks end with a D- record; the approvals engine. VERIFY: is the answer recorded where the next session will find it?