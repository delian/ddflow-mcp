Decision D-lock-cycle-selfheal (operator 2026-10-15, verbatim: 'Can you have those DX set for implementation next after the bug fixes and with priority over the other tasks? Can you set the rules, and also can you make sure that ddflow if it detects circular dependency or blockage which was undetected and not prevented in advance should refill the tasks with dependency on each other in order to prevent circular waiting and dependency and this way to force unblock?'). (1) PRIORITY: the locking and ordering features come right after the bug fixes and ahead of every other feature: DX-pins-regenerate, DX-no-hold-and-wait and DX-conflict-autoorder (priority 1), then DX-lease-progress-breakable, DX-lease-wait-cycle and DX-merge-queue (2), then the other DX tasks. (2) PREVENT IN ADVANCE: pin files are regenerated, not leased (DX-pins-regenerate, DX-merge-queue); a lease is never widened by hold-and-wait (DX-no-hold-and-wait); a contended lease without progress is breakable (DX-lease-progress-breakable, D-lease-hold-limit); a task that adds a knob, event kind or command declares the pin files it will touch up front. (3) DETECT: a cycle in the wait-for graph, or a wait older than a limit with nothing running, is reported by doctor, status, brief and the lanes advisor (DX-lease-wait-cycle). (4) SELF-HEAL, the new rule: when ddflow detects a circular dependency or blockage that was NOT declared and NOT prevented in advance, ddflow itself ADDS `needs` edges between the colliding items, in a deterministic order (priority, then progress, then claim time, then id), never an edge that closes a cycle, so the circular waiting cannot recur and the unblock is forced; the later item yields the contested globs and waits for the earlier one. Every edge is a logged event by actor ddflow:auto-order with the evidence, visible in brief and doctor and reversible with ddflow update --needs; [schedule].auto_order = off | propose | apply (default apply for a detected cycle or an over-limit wait, propose for repeated collisions); a repeated collision of the same pair makes the edge permanent in the plan (DX-conflict-autoorder). (5) AGENTS: never poll-wait in a private loop; use ddflow wait or report to the coordinator; do not hold a lease while waiting for another (release or yield on request); when ddflow tells you to yield, do so at the next safe point. Users and companies can change every limit and the mode (r-company-workflows).