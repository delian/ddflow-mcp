RULE: a new or changed command, knob, record kind, gate or message ships in the same change with: generated help (one declaration), a docs page or section, the knob register entry and README table regeneration, an upgrade-manifest fragment, golden pins regenerated through the recipe, and tests; a bug fix ships a regression test that failed before the fix. CHECK: version lint, docs check, knob-table test, B-evidence-contract, QA-f2p-task. VERIFY: could a new user find and use this change from the docs alone?