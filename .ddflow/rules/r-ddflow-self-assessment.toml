Decision D-ddflow-self-assessment-r2 (operator 2026-10-15, verbatim: 'at the end of every subagent execution, or a phase, or before compacting context window of subagent, there has to be an assessment for bugs of ddflow itself, misbehavior, or missing features and they have to be filled up if discovered - and as the agent is not restarted and might still work on old ddflow, check that those are not duplicated and not already corrected. This way we will be slowly correcting and testing the behavior while we use it'). (1) WHEN: every agent (subagent, fleet agent, session) runs a ddflow self-assessment at the end of its execution, at the end of each phase of its work, and BEFORE its context is compacted or handed off. (2) WHAT: ask 'what in ddflow itself misbehaved, was missing, was confusing or needed a workaround?' (a wrong or misleading message, a refused command that should work, a stuck dependency, a hand edit of generated or local files, a flag I had to guess, a slow step, a missing verb, a wrong doc) and list it, even when the answer is none. (3) HOW, so nothing is filed twice or already fixed: your ddflow may be OLD (an agent is not restarted when ddflow changes), so before filing (a) run `ddflow similar "<symptom>"`, search `ddflow list bug` and `ddflow list task` for the words, and use the add command's own duplicate check (--check; answer with --extends or --related ID when the same thing exists); (b) look at CURRENT main: `git log main --oneline | grep -i WORD` and the bug and task lists of the primary checkout (a fix may already be merged: a bug closed by a regression test, a DX- task completed); (c) if you can, reproduce the symptom with the code on main in a temporary repository (never against the live .ddflow/events) before calling it a bug; (d) if it is already fixed on main but you saw it on an older ddflow, do not file it: write 'already fixed by ID, restart or upgrade' in your report. (4) FILE: a bug with `ddflow bug found --new --scope ddflow --severity S --title T --summary SUMMARY` (what happened, the cause if known, the fix direction, the regression test), or a feature task with `ddflow task add --new DX-SLUG --tags feature,ddflow-gap` (what was missing, what it cost, the fix). (5) REPORT: end the report with a 'ddflow assessment' line: the ids filed, the ids extended or linked, the ones skipped as already fixed, or 'none found'. (6) Never only work around a defect. This is how ddflow is corrected and tested by use. Extends D-file-ddflow-defects.