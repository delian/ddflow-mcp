Operator 2026-11-12: any feature must be configurable by the user (and by company policy layers) in four ways with the same result: (1) a plain prompt to the agent, which the agent turns into the command; (2) an MCP command that reuses an existing family or the configure tool and adds an action, never a new always-listed tool per feature (the MCP surface stays low: r-tool-diet, the budget tests, the lean profile; a new tool needs an exemption with a reason); (3) a CLI command; (4) the config file at any layer (system, company, project, user). All four go through services/configwrite and the one declaration, so they cannot drift; every change is logged (config.changed) and restorable. A company floor can mark a value non-overridable below it; a project may tighten but not loosen it. Done means: the knob, its doc, the CLI and MCP route, a prompt example in the help topic, an upgrade fragment, and a test that runs with the override. The standards gate and reviewers check it. Extends r-everything-configurable and r-company-workflows.