R-observability 7; extends r-unavailable-not-pass to telemetry. RULE: a measurement that could not be taken (no meter, no usage block, collector off) is reported unavailable, never 0; anything imported (cost, tokens) is labelled approximate. CHECK: an unavailable-path test per metric (OBS-cost-gate). VERIFY: what does this metric show when its source is missing?