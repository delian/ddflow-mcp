Lessons of 2026-11-02/03. RULE: a review finding is confirmed or refuted with a probe or test id and the verdict is RECORDED per finding; a gate skip or override request states exact counts (found, fixed, filed as follow-up, refuted, untriaged = 0) and the bug id of any known tool defect; time pressure, load or the coordinator's wish is never a reason; a claim of 'fixed' needs a test that failed before; a number in a report names its method. CHECK: gate status shows untriaged findings; the approval request text is machine-checked for counts (QA-agent, RU-check). VERIFY: could a reader reproduce the claim from the record alone?