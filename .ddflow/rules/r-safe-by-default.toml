Decisions D-qa-evidence-answers, D-change-answers, D-baseline-red-auto-accept. RULE: every new check, gate, auto-approval, auto-apply or enforcement mode names its default in a decision: warn, advisory or off unless the operator chose enforce; standing rules and auto-apply ship off; every automatic action is logged, reversible with one call and has a kill-switch knob lockable by org policy; destructive and external actions are dry-run by default. CHECK: knob-register review and RU-check. VERIFY: what is the default, who decided it, and how is it switched off?