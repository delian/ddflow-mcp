Decision D-observability-answers, R-observability 7. RULE: a telemetry record (event field, ring row, export) carries ids, durations, counts, sizes and hashes; prompt text, command arguments, outputs and paths are excluded by an allowlist (builds on r-secrets and PM-retention). CHECK: an allowlist schema test per telemetry record (OBS-cmd-log, PM-store). VERIFY: could this field contain text a user or file wrote?