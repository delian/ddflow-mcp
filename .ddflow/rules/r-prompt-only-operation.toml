updated = "2026-11-14T00:28:54.706919+00:00"

OPERATOR 2026-11-14. RULE: the user may have no access to the files, the filesystem or a shell: the work may run in a CI/CD pipeline, behind an API, in a dynamically created container or on a remote virtual machine that the user cannot reach. So every call, every answer and every approval must be possible through the agent's prompt or UI alone: no step may need the user to open a file, edit a config by hand, or run a command in a terminal (extends r-no-shell (1); a person-only act is answered by a recorded answer, not by a shell). Interaction is designed to be the easiest possible for the person: a question is a structured choice the person clicks or selects (the agent UI's question tool, a TUI select, a typed approve ID DIGEST in the chat), carries a recommended default and its consequence (r-operator-attention), and is relayed unaltered. The control session must not block on a person, or not for long: a question is a recorded request with a state (open, answered, withdrawn, superseded, expired); the control session parks the item and takes other work while it is open; when the context changes (the item merged, the need vanished, someone else answered through another channel or the CLI) the request is withdrawn or superseded and a late answer is ignored with a recorded note, never applied to a stale state. CHECK: a prompt-only conformance test for each person-facing flow (setup, ask, approve, configure, report) on a fixture with no filesystem and no shell; a test that a request answered elsewhere is superseded and that a stale answer is refused with the next call; a ratchet that no refusal or remedy tells the user to run a terminal command for a T2-or-lower act. VERIFY: could a person with only the agent chat window complete this, and does a blocked question ever stop other work?