Operator constraints. RULE: reviewer keys are exported from files in the user's secrets directory and never printed; endpoint addresses and keys go only to .ddflow/local; redaction runs before any record, blob or prompt is written; a secret found in history is a security bug (rotate, then scrub; the scrub is the operator's); evidence blobs are scanned. CHECK: gitleaks in ci and pre-commit, redaction tests, P-secrets. VERIFY: does any new log line, evidence field or prompt include a credential or hostname?