D-universal-principles: any workflow template, gate, lens, role, lint set, importer, pack, job, safeguard, document type or new record you add is a record kind on the RecordKind descriptor (RC1-RC12): CLI and one MCP action group from one declaration, add/edit/remove(tombstone)/merge/split/restore/history, search, recall, RAG export, change feed to sessions, logged events and replay. Shipped defaults are overridable per project; never overwrite a user value. List an exemption with a reason or do not ship.