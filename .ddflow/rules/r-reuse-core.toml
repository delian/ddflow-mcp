D-universal-principles: before you write a function, search for one that does it (ddflow recall, grep, the code index) and extend it; use the shared engines (record contract, registry, approvals, waivers, event registry, evaluation harness, workflow template engine, sensitivity labels) instead of a private copy. A duplicate implementation fails review (reuse lens) and the clone guard. Keep files under 20 KB.