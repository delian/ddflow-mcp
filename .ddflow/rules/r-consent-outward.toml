Decisions D-multirepo-answers, D-app-infra, D-upstream-reporting, D-lifecycle-answers. RULE: push, forge writes, issue or comment creation, outbound messages, installs, network calls to new hosts, deployments and writes into another repository need a recorded, scoped, expiring consent; default is proposal or dry-run, never a silent write; ddflow holds no tokens and acts under the person's login; acceptance, go/no-go, risk acceptance and release are person-only. CHECK: consent tests (MR-consent, TM-defect-forge, PO-feedback-import) and the approvals sites table. VERIFY: what would happen if this ran twice, or against the wrong target?