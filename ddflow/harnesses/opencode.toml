id = "opencode"
rank = 8
family = "opencode"
title = "opencode"
delta = "opencode.md"

[mcp]
path = "opencode.json"
shape = "opencode"
note = "`command` is ONE array including the arguments, and `enabled` is explicit."

[instructions]
reads = ["AGENTS.md", "CLAUDE.md"]
agents_md = "yes"
claude_md = "fallback"

[hooks]
style = "plugin"
file = ".opencode/plugins/"
emitter = "silent"
block = "throw"
session_id = "sessionID"
inject = ["session_start", "prompt"]

[hooks.events]
session_start = "session.created"
prompt = "chat.message"
pre_tool = "tool.execute.before"
post_tool = "tool.execute.after"
pre_compact = "experimental.session.compacting"
stop = "session.idle"
session_end = "session.deleted"

[plugin]
mechanism = "plugin"
manifest = "plugin: [] in opencode.json"

[commands]
dir = ".opencode/commands"
format = "markdown"

[skills]
dir = ".opencode/skills"

[subagents]
dir = ".opencode/agents"

[orchestration]
loop = "subtask"
keepalive = "session-goal"
dispatch = "opencode config/zen agent (one claimed item each)"
wait = "background task + ddflow wait"
persist = "printed ddflow next + cadence"
stop = "Ask and stop"

[detect]
process_names = ["opencode"]

[headless]
argv = ["opencode", "run"]
model_flag = "--model"
output_flag = "--format"
output_format = "json"
autonomy = "auto"

[autonomy]
profiles = { auto = "--auto" }

[facts."detect.process_names"]
s = "documented"
src = "ddflow/services/lanes/opencode.py FACTS (opencode 1.19.0 run --help, read by an earlier lane; opencode is not installed on this machine)"
d = "2026-11-14"
ver = "1.19.0"
note = "the first binary the opencode lane looks for, before kilo"

