# Provider routes: how a call reaches a model (DRV-model-catalog). Carried verbatim from the
# review PRESETS of 2026-10-30; the reader `modelreg.presets()` returns them unchanged.
#
# Each route has one fact, `endpoint`, whose value is the preset (kind, base_url, key env NAME,
# default model, family, launch). Status is `unverified` on purpose: the addresses were carried,
# not re-read. A route whose `class` is `local` costs nothing per token (see [class.local] in
# models.toml: price facts of zero) and its address here is only the tool's
# documented default port. A real endpoint (host, key env name, served model, window, limits)
# goes in the git-ignored `.ddflow/local/models.toml` (rule D-no-own-services-local-dir), never here.

[sources]
review-presets = { path = "ddflow/services/review.py", note = "PRESETS dict, carried 2026-10-30; endpoints not re-read" }

[route.openai]
class = "saas"
endpoint = { v = { kind = "openai", base_url = "https://api.openai.com/v1", api_key_env = "OPENAI_API_KEY", model = "gpt-5" }, s = "unverified", src = "review-presets", d = "2026-10-30", note = "carried from PRESETS, not re-read" }

