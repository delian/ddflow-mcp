# Control-plane facts probed by CP-verify-facts; rendered by `ddflow harness facts`.
# One row per plane or ACP adapter, each fact the shared record of services/facts.py.
# Status here: `verified` = seen running on this machine, and only then (it needs `probe`
# and `ver`); `documented` = read in the project's docs or source at the pinned commit in
# [sources], never run; `unverified` = an open question, its `v` a lead that is never read
# as true; `none` = looked for and absent at that commit, no `v`.
# A project overrides any fact, or records its own, in .ddflow/control_plane_facts.toml.
# How it was probed, and what each fact means for the queue:
# docs/ddflow/research/control-planes.md

[meta]
schema = 1

