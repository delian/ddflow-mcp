# Event kinds owned by moves. One [[kind]] per kind.

[[kind]]
name = "path.moved"
doc = "A merge landed a rename, a move or a package split; one record per move, derived from git rename detection (old path, new path, the merge sha, and how: rename, split or unavailable)."
fields = { "old" = ["str"], "new" = ["str"], "sha" = ["str"], "how" = ["str"] }
exempt = "file paths, a merge sha and a move kind recorded by merge; no authored prose to check"
