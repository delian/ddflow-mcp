# Event kinds owned by waiting (core/handlers/waiting.py unless noted). One [[kind]] per kind.

[[kind]]
name = "lease.waiting"
doc = "An agent was refused files another lease holds, and who it waits for."
fields = { "at" = ["float"], "globs" = ["list"], "holder" = ["str"], "lease_event" = ["str"], "on" = ["list"], "queue" = ["bool"], "since" = ["float"], "ttl_s" = ["int"] }
lookup = { "holder" = "an agent id compared with a lease's holder", "lease_event" = "an event id compared with the waiter's lease", "on" = "item ids, holders and glob pairs of the leases waited for" }
exempt = "a refused claim or widening's own record of who waits for which files (services.waiting): globs and ids, no authored text"
