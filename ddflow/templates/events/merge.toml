# Event kinds owned by merge. One [[kind]] per kind.

[[kind]]
name = "merge.forced"
doc = "A merge landed over unsettled required gates under [merge].require_gates = refuse: names the gates and the approval."
fields = { "agent" = ["str"], "approval" = ["dict"], "sha" = ["str"], "unmet_gates" = ["list"] }
text = ["unmet_gates"]
lookup = { "agent" = "an agent id compared", "approval" = "an approval stamp compared", "sha" = "a sha" }
exempt = "gate names and an approval stamp only; no claim about code to check"

[[kind]]
name = "merge.reconciled"
doc = "This item's landing touched a file another item changed since it forked; complete is refused until the affected tests pass on the reconciled tree."
fields = { "base" = ["str"], "files" = ["list"], "main" = ["str"], "unknown" = ["bool"] }
exempt = "file paths and merge shas a landing reconciled, recorded by merge; no authored prose to check for duplication"
