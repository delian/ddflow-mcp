dispatch_note_chars = 500
dispatch_why_items = 5
launch_enabled = false
launch_templates_file = ".ddflow/local/lane-templates.toml"
launch_max_budget_usd = 5.0
remote_exclude = [".ddflow", ".env", "**/.env"]
remote_bundle_max_bytes = 104857600
remote_return_max_bytes = 52428800
remote_return_max_commits = 200
remote_git_timeout_s = 120
remote_scan_max_blob_bytes = 1048576
remote_scan_batch_files = 64
remote_branch_prefix = "swarm/remote/"
remote_seed_name = "SEED.md"
remote_proposals_max = 5
remote_proposal_chars = 400
remote_proposals_max_bytes = 65536
remote_ssh_argv = ["ssh"]
remote_ssh_timeout_s = 60
remote_ssh_connect_timeout_s = 15
remote_copy_timeout_s = 600
remote_lanes_root = "ddflow-lanes"
remote_detail_chars = 200

[triggers]
max_fires_per_hour = 10

[upgrade]
skew = "refuse"
skew_notice = "once"
backup = "local"
backup_keep = 10
config_changes = "agent"
auto = "check"
on_start = "safe"
start_timeout_s = 10.0
release_check = "on"
check_interval_h = 24.0
index_url = ""
prereleases = false
self = "ask"

[upstream_gh]
error_max = 400

[wait]
max_call_seconds = 240

[waves]
auto_stamp = true

[worktree]
enabled = true
root = ".ddflow/worktrees"
branch_prefix = "ddflow/"
base_ref = ""
merge_strategy = "no-ff"
remove_on_merge = true
dispose_finished = true
sweep_min_age_s = 3600
sweep_interval_s = 900
stash_retries = 4
stash_retry_pause_s = 0.25
max_parallel = 0
sync_before_start = true
adopt_existing = true
local_files = []

[gate.research]
title = "Research"
description = "State a falsifiable claim before writing code, and probe it."
evidence = true
applies_to = "both"
prompt = "Before implementing: state the claim, its mechanism, the single observation that would REFUTE it, and the cheapest test that could. Run that test and paste its command AND output. Record with `ddflow research add --verdict CONFIRMED|REFUTED|THEORETICAL`. A pass with no CONFIRMED/REFUTED label is a literature summary, not research."

[gate.rules]
title = "Rules, lessons and memory"
description = "Load project rules and the lessons that bear on THIS task."
applies_to = "both"
prompt = "Run `ddflow brief --item <id>`. It returns the project rules digest and the handful of past lessons ranked against this task's text. Do not read the whole lessons corpus; that is what the ranking is for."

[gate.implement]
title = "Implement"
description = "Write the change in the task's own worktree."
prompt = "Implement in the worktree ddflow created. Touch only files inside this task's declared globs; if you must widen them, run `ddflow update <id> --globs <every glob, old and new>` FIRST (it replaces the list, and moves your lease to it) so the conflict detector can see it."

[gate.rubber_duck]
title = "Rubber-duck review"
description = "An independent model tries to REFUTE the change."
evidence = true
reviewer = "different_family"
prompt = "Dispatch a reviewer on a DIFFERENT model family than the author. Ask it to refute, not to review: 'find the input that makes this wrong'. When uncertain it must report nothing — a reviewer rewarded for finding things finds things."

[gate.critic]
title = "Cross-family critic"
description = "A second, differently-trained critic on the diff and the intent."
evidence = true
reviewer = "different_family"
prompt = "Run the configured critic over the diff WITH the task's intent. It flags where the diff and the stated intent disagree. Exit 2 means UNAVAILABLE and must be recorded as such — never as a pass."

[gate.verify]
title = "Completion verification"
description = "An independent model judges whether a DONE task's evidence meets its requirement."
evidence = true
reviewer = "different_family"
prompt = "An independent model judges whether what landed meets the requirement. ddflow performs it: `ddflow verify <id> --judge` builds the evidence pack and sends it, with the landed commit, to the configured cross-family reviewer. Optional, never part of the default pipeline: the second opinion after the mechanical `ddflow verify <id>`. A finding is a requirement clause the evidence does not show as met; unavailable is recorded as unavailable, never as a pass."

[gate.standards]
title = "Coding standards"
description = "Automated standards/architecture review (roborev, codeguide, linters)."
evidence = true
prompt = "Run the project's standards tools. Apply their FINDINGS; verify their FIXES by running the tests — a suggested fix reasoning from general language rules does not know your types' operator overloads. Review an EXPLICIT commit: `roborev review <sha>` with your branch head's sha, never `roborev review HEAD` from a worktree (it can enqueue the primary's HEAD), and record it with `gate record --reviewed-sha <sha>`: ddflow refuses a sha that is not your branch. On a loaded host review the COMBINED diff with a bounded wait: `python -m ddflow.services.roborev_branch` (one range job over the whole branch; waits `[gates].standards_wait_s`; exit 2 names why it gave nothing, and that is recorded `unavailable` WITH the reason and the job id; re-run it once the queue drains with `--job <id>`, a sha with a job is never enqueued twice)."

[gate.ci]
title = "CI parity"
description = "The exact pre-push/CI checks pass on the branch merged with the base."
command = "ddflow ci run"
evidence = true
timeout_s = 3600
applies_to = "both"
prompt = "Run `ddflow ci run`: it merges your branch with the base in a scratch worktree and runs the project's pre-push stage there (ruff check, ruff format --check, bandit, the build probe, and the tests: with `[ci].tests_scope = selected` (default) only the ones your change reaches plus the `[ci].always_tests` guards, the whole suite when the selector says so or `--full`; the scope is in the evidence). Exit 2 means it could not run (pre-commit missing, nothing configured) and is recorded unavailable, never a pass. Not part of the default pipeline: add it with `ddflow workflow pipeline task ...` or `[gates].task_pipeline`, between standards and unit_tests."
unavailable_exits = [2]
reads_ref = true

[gate.unit_tests]
title = "Unit tests"
description = "The project's tests must pass, run in parallel: covered by the item's ci run when it passed on this commit (its recorded scope: selected tests, or the whole suite), otherwise only the tests the change reaches; the whole suite runs in the merge queue, on cadence and at phase end."
evidence = true
timeout_s = 3600
applies_to = "both"
prompt = "Run it with `ddflow gate run <ID> unit_tests`, never from a run of your own. With `[ci].tests_scope = selected` (D-test-economy-r2) the item's ci run covers the affected tests, so this gate is `covered by ci selected run <sha>` or runs only the difference; the whole suite is the merge queue's, the cadence's and the phase end's (`ddflow ci run --full`), not an item's. Run it in parallel -- pytest with `-n auto` (pytest-xdist) or a fixed worker count; `ddflow workflow` says when the command uses ONE core. While you work, `ddflow tests --item <ID>` lists the tests your change reaches and a parallel command for them: fast feedback, not this gate. Set `[gate.unit_tests].command` in .ddflow/config.toml so this gate runs itself, e.g. `pytest -q -n auto`."

[gate.bug_hunt]
title = "Bug hunt"
description = "Hunt the recurring bug classes across everything this unit touched."
evidence = true
applies_to = "both"
prompt = "Hunt: off-by-one, empty-collection/vacuous-truth, silently dropped config, torn-tail resume, unavailable-treated-as-clean, dead knobs. A finding may only change source if a runnable probe demonstrates it AND ships as the regression test in the same commit — then MUTATE the fix and watch the probe fail. A probe that passes both ways proves nothing. No probe -> file it as THEORETICAL, change nothing."

[gate.dedupe]
title = "Deduplication"
description = "Did this work re-implement something the project already has?"
evidence = true
applies_to = "both"
prompt = "Search by OPERATION, not by the name you invented ('retry with backoff', 'atomic write'). Start from a mechanical clone report if the project has one. Second occurrence: reuse or extract. Third: extraction is mandatory."

[gate.live_test]
title = "Live smoke run"
description = "Actually run the feature end to end, not just its tests."
evidence = true
applies_to = "phase"
prompt = "Run the real thing on a small input and paste the output. A green unit suite and a working feature are different claims."

[gate.docs]
title = "Documentation"
description = "The README and docs describe what this phase changed, before it merges."
evidence = true
applies_to = "phase"
prompt = "Read the phase's whole diff (the phase base..HEAD) and list every change a user or an agent can see: commands and MCP tools, flags, config knobs and their defaults, output, install and setup steps. Check each against the README and the project's documentation, and update what is missing or wrong in this phase -- a stale page is worse than a missing one, because a reader trusts it. Check counts and examples the README states (knob counts, command samples) still hold. Record the files you changed, or 'no user-visible change' with the reason; an unexplained pass is not evidence."

[gate.corrections]
title = "Corrections"
description = "Apply what the phase-level passes surfaced."
applies_to = "phase"
prompt = "Fix what the phase gates found; each fix carries its own regression test."

[gate.tasks]
title = "Member tasks"
description = "Fan-out point: every task in the phase reaches done."
applies_to = "phase"
prompt = "Not performed by hand. `ddflow next --phase <id>` offers the ready set; independent tasks run in parallel worktrees."

[gate.merge]
title = "Merge"
description = "Land the work on the base branch."
applies_to = "both"
prompt = "`ddflow merge <id>` — merges from the primary checkout without a checkout."
needs_branch = true
