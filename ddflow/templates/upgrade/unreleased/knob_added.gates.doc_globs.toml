# One unreleased change; cutting a version folds it into that release.

[[change]]
kind = "knob_added"
key = "gates.doc_globs"
new = '["docs/**", "*.md", "**/*.md"]'
why = "A task whose actual change is documents only runs the doc pipeline and needs no cross-family reviewer (bug B-research-task-cannot-complete-docs-only)."
impact = "additive"
