# One unreleased change; cutting a version folds it into that release.

[[change]]
kind = "knob_added"
key = "upgrade.self"
new = '"ask"'
why = "Who may have ddflow install a newer ddflow with ddflow upgrade --self: ask (default; needs --yes --reason, recorded), operator (an agent over MCP is refused) or auto (no consent asked, --self still required)."
impact = "additive"
