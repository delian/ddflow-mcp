# One unreleased change; cutting a version folds it into that release.

[[change]]
kind = "knob_changed"
key = "lease.new_file_globs"
old = "[\"ddflow/templates/upgrade/unreleased/*.toml\"]"
new = "[\"ddflow/templates/upgrade/unreleased/*.toml\", \"tests/**\"]"
why = "A fix task's new regression test under tests/ needs no glob of its own."
impact = "additive"
