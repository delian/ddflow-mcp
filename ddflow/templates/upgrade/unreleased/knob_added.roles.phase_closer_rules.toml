[[change]]
kind = "knob_added"
key = "roles.phase_closer_rules"
new = "[\"Tests first: a regression test that fails against the unfixed code, then the change.\", \"Ratchet offenders are read by name (architecture interfaces, constants ratchet, every family of the dependency guard); never add a baseline entry.\", \"Run the suite detached with the maximum timeout: DDFLOW_CI_SUITE_WAIT_S=21600 setsid nohup ddflow gate run ID ci --timeout 21600, with a heartbeat loop you stop by pid; commit nothing while it runs.\", \"Approvals: file the request from your directory, report its Q id to the coordinator and stop on that item; re-run with --approval once relayed (single use, bound to the command, state and directory). Never approve anything yourself.\", \"Pins: one pins recipe per approval, each fresh after the previous is committed; audit each diff and commit only what your work caused.\", \"Docs-wave stop: when the phase's remaining work is inherited docs-wave needs, stop and report; do not lift the need.\", \"Never push. Finish means nothing ahead of main for your worktree and your event log committed.\"]"
why = "CO-brief-roles: role packs for `ddflow brief --role R`."
impact = "additive"
