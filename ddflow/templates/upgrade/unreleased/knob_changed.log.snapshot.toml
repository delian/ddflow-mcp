[[change]]
kind = "knob_changed"
key = "log.snapshot"
old = "true"
new = "false"
why = "A measured cold load is slower with the read snapshot than without (3.6 s against 2.8 s at 132k events). Set log.snapshot = true to keep it; old snapshot files stay readable when it is on and are deleted when it is off."
effect = "A cold command parses the log instead of reading a snapshot, and snapshot files left in .ddflow/local are deleted."
