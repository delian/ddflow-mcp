# One unreleased change; cutting a version folds it into that release.

[[change]]
kind = "knob_added"
key = "output.max_chars"
new = "30000"
why = "Characters a default answer of those commands may hold, so a tool result stays under an MCP client's 25000-token cap (UX-output-caps)."
effect = "board, doctor, recover, next and status print a bounded default and end in a footer naming the next call; `--json` and scripts reading those lists get the cut list plus `truncated` and `next` until they pass --full"
impact = "additive"
