# The ddflow upgrade manifest (B-upgrade.2-changes): what changed in each release.
# Read by ddflow.services.upgrade_manifest; rebuilt by `scripts/upgrade_manifest.py
# backfill`, which keeps every hand-written why/effect/impact/enable and every refresh,
# repair and feature entry. Defaults are JSON-encoded strings. Changes not yet released
# are one fragment file each under unreleased/.
schema_version = 1

[base]
version = "0.1.3"
event_kinds = [
    "bug.fixed",
    "bug.found",
    "bug.invalid",
    "cadence.ran",
    "decision.recorded",
    "decision.superseded",
    "external.observed",
    "flow.chosen",
    "gate.failed",
    "gate.out_of_order",
    "gate.partial",
    "gate.passed",
    "gate.skipped",
    "gate.started",
    "gate.unavailable",
    "item.abandoned",
    "item.blocked",
    "item.completed",
    "item.resolved",
    "item.started",
    "item.unblocked",
    "job.ended",
    "job.started",
    "lease.acquired",
    "lease.expired",
    "lease.released",
    "lease.renewed",
    "lesson.recorded",
    "memory.forgotten",
    "memory.recorded",
    "phase.added",
    "phase.removed",
    "phase.updated",
    "port.applied",
    "pr.changes_requested",
    "pr.closed",
    "pr.merged",
    "pr.opened",
    "pr.synced",
    "release.closed",
    "release.opened",
    "release.tagged",
    "research.recorded",
    "session.ended",
    "session.note",
    "session.prompt",
    "session.started",
    "task.added",
    "task.removed",
    "task.updated",
    "worktree.adopted",
    "worktree.created",
    "worktree.merged",
    "worktree.removed",
]

