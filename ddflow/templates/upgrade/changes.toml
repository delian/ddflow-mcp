[[release.change]]
kind = "knob_added"
key = "schedule.adapt_up_after_s"
new = "600"
why = "Seconds of all-healthy samples, with the limit actually binding (in flight reached it), before auto raises the limit by one (default 600)."
impact = "additive"

[[release.change]]
kind = "knob_added"
key = "schedule.max_parallel_max"
new = "8"
why = "The ceiling of the adaptive limit (default 8, at least 1): auto never exceeds it, whatever the signals say."
impact = "additive"

[[release.change]]
kind = "knob_added"
key = "schedule.max_parallel_min"
new = "2"
why = "The floor of the adaptive limit (default 2, at least 1): however bad the signals, auto never offers fewer slots than this."
impact = "additive"

[[release.change]]
kind = "knob_added"
key = "schedule.parallel"
new = "\"auto\""
why = "'auto' (default): the number of items in flight adapts between max_parallel_min and max_parallel_max on health signals; 'fixed': it stays at max_parallel_tasks."
impact = "additive"

[[release.change]]
