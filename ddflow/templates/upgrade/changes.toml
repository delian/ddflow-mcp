key = "review.combined_under_lines"
new = "150"
why = "A change with fewer changed lines than this (default 150; 0 = never) gets ONE review request covering both the rubber_duck and critic lenses, recorded for both gates."
impact = "additive"

[[release.change]]
kind = "knob_changed"
key = "review.delta_default"
old = "true"
new = "false"
why = "Whether `ddflow review <id> --gate G` on a gate that already has a recorded review rechecks ONLY the commits since the head that review covered, instead of the whole diff."
effect = "a plain re-review sends the item's whole diff with the previous findings and their triage; --delta asks for only the commits since the last review"

