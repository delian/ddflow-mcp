# Register of tunable module-level constants (ddflow/services/constants_audit.py).
#
# D-everything-configurable rule 6: a tunable constant is a [knob] still to migrate (the
# value is the PROPOSED config key) or an [exempt] structural constant (the value is the
# reason). tests/test_constants_ratchet.py fails a NEW constant in neither table and a
# stale entry, so the register only SHRINKS: a migrated constant leaves [knob] in the
# change that deletes it. Run scripts/ci/constants-audit for the report, ranked by how
# user-visible each is.
#
# The [knob] / [exempt] tables do NOT live in this file. They live ONE FILE PER MODULE
# beside it, under docs/ddflow/constants-exemptions.d/<dotted.module>.toml (the module
# path with `/` and `.py` folded to dots). constants_audit.load_register reads this file
# and every `*.toml` there together, so a change that registers or re-homes a constant -- a
# <30k split moving it into a package, say -- edits ONLY its own module's fragment and never
# leases or hand-edits a shared register. A module's fragment is deleted when its last
# constant leaves it, and a module with no tunable constants has no fragment (git tracks no
# empty directory). This file carries no tables of its own precisely so lanes working in
# different modules never contend on it.
