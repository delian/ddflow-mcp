# D-everything-configurable rule 6: a tunable constant is a [knob] still to migrate (the value
# is the PROPOSED config key) or an [exempt] structural constant (the value is the reason).
# tests/test_constants_ratchet.py fails a NEW constant in neither table and a stale entry, so
# this file only SHRINKS: a migrated constant leaves [knob] in the change that deletes it.
# Run scripts/ci/constants-audit for the report, ranked by how user-visible each is.

