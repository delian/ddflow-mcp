[exempt]
"ddflow/infra/log.py:_HOLDER_SCANS_MAX" = 'a bound on a diagnostic-only rescan of /proc/locks while a lock-timeout message is built; it shapes an error note, never behaviour, so no operator needs the knob'
"ddflow/infra/log.py:_HOLDER_SCAN_S" = 'the time cap of the same diagnostic rescan (companion of _HOLDER_SCANS_MAX)'
"ddflow/infra/log.py:_MAX_INCREMENTAL" = 'internal timing of a lock or poll loop (tested contract of the lock itself), not a workload setting'
