# Publish to PyPI, Docker Hub, ghcr.io and the MCP registry. A push to main that changes
# shipped code bumps the PATCH version, commits the bump to main and releases it; a `v*`
# tag releases exactly the version it names. The `gate` job says how the version is chosen.
#
# HOW THIS AUTHENTICATES, per target — four mechanisms, and only one stored secret.
#
#   PyPI          OIDC trusted publishing. `id-token: write` mints a short-lived token
#                 PyPI verifies against this repo's identity. Needs a one-time trusted
#                 publisher configured on PyPI (project, owner, repo, workflow file,
#                 environment `release`). No token stored here.
#   ghcr.io       `secrets.GITHUB_TOKEN`, which Actions injects for every run, scoped to
#                 this repository and expiring with the job. Needs `packages: write`.
#   Docker Hub    `secrets.DOCKERHUB_USERNAME` + `secrets.DOCKERHUB_TOKEN`. **The one
#                 exception**: Docker Hub has no OIDC equivalent, so this is a real
#                 long-lived credential you must create and store. Use an access token
#                 scoped to Read/Write on this repository, never an account password —
#                 and an earlier version of this header claimed no registry needed a
#                 stored secret, which stopped being true the moment this job was added.
#   MCP registry  `mcp-publisher login github-oidc`. GitHub OIDC proves control of the
#                 `delian` account, which is what entitles this server to the
#                 `io.github.delian/*` namespace declared in server.json. No token.
#   tag/release   `secrets.GITHUB_TOKEN` with `contents: write`.
#   release commit  the same token, `contents: write` on `gate`. A branch-protection rule
#                 on main that refuses github-actions[bot] refuses the bump: allow the
#                 bot to push, or no release gets past `gate`.
#
# `environment: release` on the jobs that publish holds the Docker Hub secrets and is the
# environment PyPI's trusted publisher is bound to. It has NO required reviewers (operator,
# 2026-10-01: releases publish without a manual approval); adding reviewers to it in the
# repository settings would make every release wait for a human again, with no change here. If Docker Hub is one credential too many, delete that login step and
# the two `docker.io/...` tags — ghcr.io alone still satisfies the OCI entries an IDE
# marketplace needs, and server.json lists both so a client picks whichever resolves.
name: publish

on:
  push:
    branches: ["main"]
    # Only a push that changes what ships releases. The wheel is `ddflow/` and the image is
    # built from it plus these files; a push of docs, tests or the ddflow event log changes
    # neither, and releasing it would mint a permanent PyPI version identical to the last.
    # (GitHub does not evaluate path filters for tag pushes, so `v*` below still fires.)
    paths:
      - "ddflow/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - ".dockerignore"
      - "README.md"            # the PyPI page -- and the line the MCP registry verifies
      - "server.json"
    tags: ["v*"]               # an explicit tag publishes exactly that version, no bump
  workflow_dispatch:           # release now, by the same rule as a push

# One release at a time. Two overlapping runs would both read the same version and bump
# to the same number, and the second would collide with the first on PyPI.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- what to publish, if anything
  gate:
    # CI bumps only the PATCH version; major and minor are the operator's to move
    # (operator, 2026-09-30): 0.1.1 -> 0.1.2, 1.1.2 -> 1.1.3. A push to main that changes
    # shipped code is the release decision, so nobody has to remember scripts/bump.sh.
    #
    # The rule is "publish the declared version if PyPI does not have it yet, otherwise
    # bump patch and publish that". The first half is how a person moves major or minor
    # (`scripts/bump.sh minor|major|X.Y.Z`, commit, push: published as declared, and the
    # patches continue from it), and how a release that failed after its bump landed is
    # retried with the new code instead of being skipped.
    #
    # The bump is committed to main BEFORE anything publishes. Pushed last, a push that
    # lost a race with another commit would leave PyPI holding a version main does not
    # declare, and the next run would bump to that same number and be refused. Pushed
    # first, losing the race fails this job and publishes nothing. A push made with the
    # workflow's GITHUB_TOKEN does not trigger workflows, so the release commit cannot
    # start another release (and the actor check below holds if that token ever changes).
    #
    # Releases come from main or a tag only: `workflow_dispatch` can be started on any
    # branch, and a bump pushed there would publish code main has never seen.
    if: >-
      github.actor != 'github-actions[bot]'
      && (github.ref_type == 'tag' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write          # the release commit on main
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0   # bump.sh re-locks uv.lock, which records the version
      - id: decide
        run: |
          set -eu
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)

          if [ "${{ github.ref_type }}" = "tag" ]; then
            {
              echo "publish=true"; echo "version=$version"; echo "sha=$(git rev-parse HEAD)"
            } >> "$GITHUB_OUTPUT"
            echo "tag push — publishing $version as declared"; exit 0
          fi

          # 200 = released, 404 = not yet. Anything else is PyPI being unreachable, and
          # guessing either way is wrong: "not released" would republish, "released" would
          # skip a number. Fail, and the next push retries.
          pypi() { curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/ddflow-mcp/$1/json"; }
          code=$(pypi "$version")
          case "$code" in
            404)
              echo "$version is declared and not on PyPI yet — publishing it without a bump" ;;
            200)
              # The next patch PyPI does NOT have. The obvious +1 can be taken already -- a
              # `v*` tag publishes out of band, and never moves main's declared version --
              # and committing `release X.Y.Z` for a number PyPI holds would put a false
              # release on main before the upload failed. Checked here, before any commit.
              next=$version
              for _ in $(seq 1 50); do
                next=$(python3 -c 'import sys; a, b, c = sys.argv[1].split("."); print(f"{a}.{b}.{int(c) + 1}")' "$next")
                taken=$(pypi "$next")
                [ "$taken" = 404 ] && break
                [ "$taken" = 200 ] || { echo "::error::PyPI answered HTTP $taken for ddflow-mcp $next"; exit 1; }
                echo "$next is on PyPI already (released out of band) — skipping it"
              done
              [ "$taken" = 404 ] || { echo "::error::no free patch version within 50 of $version"; exit 1; }
              scripts/bump.sh "$next"
              version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git commit -qam "release $version"
              # Refused if main moved since checkout: nothing has been published yet.
              git push origin "HEAD:${{ github.ref_name }}"
              echo "bumped patch and committed to ${{ github.ref_name }} — publishing $version" ;;
            *)
              echo "::error::PyPI answered HTTP $code for ddflow-mcp $version; cannot tell whether it is released"
              exit 1 ;;
          esac
          {
            echo "publish=true"; echo "version=$version"; echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - name: Refuse to republish a version that already exists
        # A tag push only: the main path above has already chosen a version PyPI lacks. A
        # tag naming a released version is a mistake, and a sentence here beats a
        # confusing 400 from PyPI.
        if: github.ref_type == 'tag'
        run: |
          v='${{ steps.decide.outputs.version }}'
          if curl -fsSL "https://pypi.org/pypi/ddflow-mcp/$v/json" >/dev/null 2>&1; then
            echo "::error::ddflow-mcp $v is already on PyPI. Bump the version."
            exit 1
          fi
          echo "$v is not on PyPI yet"

  # ---------------------------------------------------------------- prove it works, ONCE
  verify:
    # Extracted from `pypi`, where it used to live as two inline steps. The bug that
    # earned it its own job: `docker` declared `needs: gate` only, so a push whose
    # suite was RED still pushed `:latest` to Docker Hub and ghcr.io while PyPI
    # correctly refused. A release that is half-published is worse than one that fails
    # -- `:latest` is on somebody's disk by the time anyone notices, and it cannot be
    # taken back.
    #
    # One job, and everything that publishes depends on it. Two copies of "run the
    # tests" is how one of them came to be missing in the first place.
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Test before publishing
        run: uv run pytest tests/ -q --timeout=420 -n auto
      - name: Scenarios before publishing
        # A release is the one moment it is worth the ten minutes. `-m 'not slow'` in
        # addopts meant the suite that has found most of this project's defects had
        # never gated a publish.
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ddflow ci"
          git config --global init.defaultBranch main
          uv run pytest tests/test_scenarios.py -m slow -q --timeout=1800

  pypi:
    needs: [gate, verify]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write          # OIDC trusted publishing; no PyPI token stored
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Verify the tag matches the declared version
        run: |
          # A tag that disagrees with pyproject.toml publishes a version nobody can
          # reproduce from the tree. Fail loudly rather than shipping the mismatch.
          # On a tag push this is the tag; on a main push the gate already told us the
          # version, and comparing "main" against pyproject would fail for the wrong reason.
          tag="${{ needs.gate.outputs.version }}"
          decl=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          srv=$(python -c 'import json;print(json.load(open("server.json"))["version"])')
          test "$tag" = "$decl" || { echo "tag $tag != pyproject $decl"; exit 1; }
          test "$tag" = "$srv"  || { echo "tag $tag != server.json $srv"; exit 1; }
          # Every OCI identifier carries the version as its TAG. A `:0.1.0` left behind
          # while `version` moved on would publish a manifest pointing at the previous
          # image -- discoverable, installable, and the wrong build.
          python - "$tag" <<'PY'
          import json, sys
          want = sys.argv[1]
          bad = [
              p["identifier"]
              for p in json.load(open("server.json"))["packages"]
              if p.get("registryType") == "oci" and not p["identifier"].endswith(f":{want}")
          ]
          if bad:
              sys.exit(f"OCI identifiers not tagged {want}: {bad}")
          PY
      - name: Refuse a release the MCP registry would reject
        # The registry verifies ownership of every package server.json lists: the PyPI
        # README must carry `mcp-name: <server name>`, each image the label below. It
        # checks the exact version, and a PyPI version cannot be replaced -- so a miss
        # found by `mcp-publisher` (publish #36) costs a version number. Checked here,
        # before anything is uploaded.
        run: |
          name=$(python -c 'import json;print(json.load(open("server.json"))["name"])')
          grep -qF "mcp-name: $name" README.md \
            || { echo "::error::README.md lacks 'mcp-name: $name' (MCP registry ownership)"; exit 1; }
          grep -qF "io.modelcontextprotocol.server.name=\"$name\"" Dockerfile \
            || { echo "::error::Dockerfile lacks LABEL io.modelcontextprotocol.server.name=\"$name\""; exit 1; }
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    needs: [gate, verify]
    if: needs.gate.outputs.publish == 'true'
    # Both registries, one build. `delian/ddflow-mcp` on Docker Hub is what the README
    # documents; `ghcr.io` needs no account beyond the repo's own and is what CI can
    # push with nothing stored. The image is minimal on purpose -- alpine + git + the
    # package, no toolchain -- because it exists for operators who have no Python and
    # should not have to acquire one.
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write          # ghcr.io, via the workflow's own GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # arm64 as well as amd64: an operator on an Apple-silicon laptop running this
          # under emulation pays a startup cost on every tool call, and tool calls are
          # what this server does.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/delian/ddflow-mcp:${{ needs.gate.outputs.version }}
            docker.io/delian/ddflow-mcp:latest
            ghcr.io/delian/ddflow-mcp:${{ needs.gate.outputs.version }}
            ghcr.io/delian/ddflow-mcp:latest
          provenance: true
          sbom: true
      - name: Smoke-test the pushed image over real JSON-RPC
        # A built image that cannot answer `initialize` is a broken release that every
        # marketplace will happily offer. Cheap to check, and the one check that
        # distinguishes "it compiled" from "it works".
        run: |
          # A scratch repo, not "$PWD" -- the same reason as scripts/release.sh: the
          # state to smoke-test is the one a NEW user is in, and mounting the source
          # checkout makes the test depend on how that checkout happens to be laid out.
          smoke=$(mktemp -d); git init -q "$smoke"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            | docker run -i --rm -v "$smoke:/repo" ghcr.io/delian/ddflow-mcp:${{ needs.gate.outputs.version }} \
            | tee /dev/stderr | grep -q '"serverInfo"'

  mcp-registry:
    # AFTER docker as well as pypi: `mcp-publisher` validates that every package named
    # in server.json actually exists, so publishing the manifest before the image is
    # pushed fails -- and publishing it before PyPI would advertise a version uvx cannot
    # fetch.
    needs: [gate, pypi, docker]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # OIDC auth to the MCP registry via GitHub identity
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Install mcp-publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin mcp-publisher
      - name: Publish server.json
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish

  # ---------------------------------------------------------------- record what shipped
  tag:
    # LAST, and only once everything actually published. A tag is the project's claim
    # that a version exists everywhere it should; creating it before the pushes succeed
    # would make that claim false, and a tag pointing at a half-release is worse than no
    # tag because it looks authoritative.
    needs: [gate, pypi, docker, mcp-registry]
    if: needs.gate.outputs.publish == 'true' && github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.gate.outputs.version }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "ddflow-mcp $V

          Published to PyPI, docker.io/delian/ddflow-mcp, ghcr.io/delian/ddflow-mcp
          and the MCP registry by .github/workflows/publish.yml."
          git push origin "v$V"
          gh release create "v$V" --generate-notes --verify-tag \
            --title "ddflow-mcp $V" || echo "::warning::tag pushed; release creation failed"
