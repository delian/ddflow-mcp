# What CI runs (.github/workflows/ci.yml), run before the push instead of after it.
#
#   ln -sf ../../scripts/ci/pre-push "$(git rev-parse --git-common-dir)/hooks/pre-push"
#                             # once per clone -- NOT `pre-commit install`; see below
#   pre-commit run --hook-stage pre-push --all-files     # the whole set, on demand
#   SKIP=tests git push       # skip one hook by id, when you know why
#
# The hook is scripts/ci/pre-push, which runs these checks in a scratch worktree of the
# commit being pushed. `pre-commit install` would run them in YOUR tree, and pre-commit
# fails a hook when anything in the tree changes while it runs: ddflow agents append to the
# committed event logs constantly, so the minute-long test hook failed with every test
# green (B431fff0197). The script's header has the whole story.
#
# PRE-PUSH, not pre-commit, deliberately. The per-commit hooks in this repository belong to
# `ddflow hooks install` (lease enforcement, commit-message checks); `pre-commit install`
# for those types would move them aside as `.legacy`. The push is also the moment that
# matters: CI runs on what reaches GitHub, and a commit-time suite of minutes teaches
# people `--no-verify`.
#
# Every Python tool runs through `uv run`, as CI does, so its version is the one uv.lock
# pins -- a hook repo pinning its own ruff formats differently from CI's, and that drift
# is exactly the red run this file exists to prevent (run 36694543037: quota.py was not
# ruff-formatted; two scenarios closed a phase without the then-new `docs` gate).
#
# NOT covered locally, by choice: the 3.11/3.13 matrix (this runs your interpreter only),
# CodeQL, pip-audit (advisory in CI anyway), and the concurrency/load suite
# (tests/test_mcp_load.py, minutes of timing-sensitive runs).
minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-push]
default_stages: [pre-push, manual]

repos:
  - repo: local
    hooks:
      # -- the CI `tests` and `quality` jobs: lint and format -------------------------
      - id: ruff-check
        name: "ruff check (CI: Lint)"
        entry: uv run ruff check .
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: ruff-format
        name: "ruff format --check (CI: Lint)"
        entry: uv run ruff format --check .
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      # -- the CI `quality` job --------------------------------------------------------
      - id: build-probe
        name: "the wheel builds, installs, runs and carries its templates (CI: Build)"
        entry: scripts/ci/build-probe.sh
        language: system
        files: ^(ddflow/|pyproject\.toml$|uv\.lock$|scripts/ci/)
        pass_filenames: false
      - id: bandit
        name: "bandit (CI: Static security scan)"
        entry: uv run --no-project --with bandit bandit -q -r ddflow/ -ll
        language: system
        files: ^ddflow/
        pass_filenames: false
      - id: deps-allowlist
        name: "runtime dependencies stay on the allowlist (CI: Dependency audit)"
        entry: uv run --no-project python scripts/ci/deps-allowlist.py
        language: system
        files: ^(pyproject\.toml|scripts/ci/deps-allowlist\.py)$
        pass_filenames: false
      - id: gitleaks
        # The commits being pushed, not the index; how the range is chosen, and why no
        # fallback may name a missing ref, is in the script.
        name: "gitleaks over the pushed commits (CI: Secrets)"
        entry: scripts/ci/gitleaks-pushed.sh
        language: golang
        additional_dependencies: [github.com/zricethezav/gitleaks/v8@v8.30.1]
        always_run: true
        pass_filenames: false

      # -- the CI `tests` and `scenarios` jobs, as ONE pytest session -----------------
      - id: tests
        # One session, not two hooks in a row: the scenarios run beside the unit tests
        # instead of after them. `-n auto` is one worker per CPU the machine has, and
        # `worksteal` lets an idle worker take tests queued behind a long one -- the default
        # scheduler hands tests out in batches, which put all six scenarios on three
        # workers, two each, back to back (6 min instead of under 2 on a 192-thread box).
        # DDFLOW_DEMO_NO_REVIEWER: CI has no model server, so its scenarios take the
        # no-reviewer path; on a machine with one, a real review made mcp-orchestration
        # alone take 89-240 s, depending on the server's load.
        name: "unit tests + end-to-end scenarios (CI: tests, scenarios)"
        entry: >-
          env DDFLOW_DEMO_NO_REVIEWER=1
          uv run pytest tests/ -m "not slow or scenarios" -q --timeout=420
          -n auto --dist worksteal
        language: system
        files: ^(ddflow/|tests/|demos/|pyproject\.toml$|uv\.lock$|\.importlinter$)
        pass_filenames: false

  # A workflow file that does not validate fails on GitHub before any job runs.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-workflows
