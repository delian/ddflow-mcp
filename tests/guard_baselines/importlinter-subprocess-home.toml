# The `ignore_imports` allowlist of the .importlinter contract `subprocess-home`
# (subprocess is imported only by ddflow.infra.proc and ddflow.infra.git), which
# tests/test_architecture_guards.py joins back into the contract before it runs
# import-linter.
#
# Each entry is an import that breaks the contract TODAY. An entry may only be removed,
# never added: a new violation fails the contract, and an entry that no longer matches
# any import fails too. When a refactor moves an import, edit its entry in the same
# change; never add one to make a new import pass. An entry marked "home" is permanent:
# the one module allowed to own that import.
ignore_imports = [
    # home
    "ddflow.infra.proc -> subprocess",
    "ddflow.infra.claimref -> subprocess",
    "ddflow.infra.paths -> subprocess",
    "ddflow.services.bisect -> subprocess",
    "ddflow.services.onboard_verify -> subprocess",
    "ddflow.services.review -> subprocess",
    "ddflow.surfaces.mcp -> subprocess",
]
