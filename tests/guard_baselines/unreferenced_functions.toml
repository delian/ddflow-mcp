# Ratchet `unreferenced_functions` (tests/test_architecture_guards.py) counts
# module-level functions whose name nothing in ddflow/ mentions, less [kept] below.
#
# Lower the baseline in the same change that removes sites; the failure message
# prints the exact value. Never raise it.
baseline = 0

# Unreferenced on purpose: the work that wires each in is planned (B-uni-dead-code).
# An entry leaves this table in the change that gives it a caller -- a test holds
# that -- and a new unreferenced function is either wired, deleted, or listed here
# with its task. (Not counted at all, so not listed: argparse `Action.__call__`'s
# `option_string`, which vulture reports at cli.py and is the protocol's signature,
# not dead code.)
[kept]
# The production wiring of the ExternalTool port (ADP-tools): `ddflow.services.toolrun`; SEC-scanners
# is its first caller.
"ddflow/services/toolrun.py:external_tool" = "SEC-scanners"
# Builds a HumanChannel from its settings (ADP-notify-ask); the [notify] knobs and their callers wire it.
"ddflow/services/ask/channels.py:open_channel" = "ADP-notify-knobs"
# Per-role schema cost of a lean agent definition (LS-agents); the LS-e2e probe matrix reports it.
"ddflow/surfaces/startcost_texts.py:role_tokens" = "LS-e2e"
# Renders a document type from its sources (B-dt-sources); B-dt-ownership's render.py calls it.
"ddflow/services/doctypes/sources.py:render_type" = "B-dt-ownership"
# The pre-push tripwire hook ids (frozen-workflow-files); the ci run names the hooks that fire
# over a changed range (api/ci.py check_after_merge). tests/test_ci_tripwire_hooks.py pins it.
# Adaptive flow (D-adaptive-flow): the admission target; the quota signal is the
# remaining wiring. (The doctor's too-little-history notes are wired: Bc6784dab3c.)
"ddflow/core/flowcontrol.py:decide_admission" = "B-af-quota-signal"
# Usage quotas (D-quotas): the api awaits its surfaces.
"ddflow/api/quota.py:quota_declare" = "BL-quotas"
"ddflow/api/quota.py:quota_show" = "BL-quotas"
"ddflow/api/quota.py:quota_list" = "BL-quotas"
"ddflow/api/quota.py:quota_forget" = "BL-quotas"
# Usage meters: `ddflow quota snapshot` is their caller, in the command surface.
"ddflow/services/meters_vendor.py:snapshot_statusline" = "B-quota-surfaces"
"ddflow/services/meters_vendor.py:snapshot_stream_line" = "B-quota-surfaces"
# One DAG module (B-uni-graph): the transitively reduced phase graph is its first caller.
"ddflow/core/graph.py:transitive_reduction" = "B-rm-graph"
# The upgrade manifest (B-upgrade.2-changes.1-manifest): the upgrade plan reads what changed
# since a project's version; the release lint compares the running knobs with the replay.
# Guidance enforcement (B-uni-guidance-enforce): the plumbing awaits P-decisions' callers,
# which read waivers from the log and put review reminders in brief and doctor.
"ddflow/services/guidance/waivers.py:approved_in" = "B-dec-waivers"
"ddflow/services/guidance/review.py:reminders" = "B-dec-review"
# The record surface (B-uni-record-surface.2-surface): a family moves onto it by calling this
# with its RecordKind; B-rules-cli is the first to.
"ddflow/surfaces/records.py:add_record_commands" = "B-rules-cli"
# The upstream bug-report plumbing (B-upstream-surfaces): the surfaces that file and deliver
# a report are its callers; the two modules stay whole until they exist.
"ddflow/services/upstream_dedupe.py:report_text" = "B-upstream-surfaces"
"ddflow/services/upstream_delivery.py:send_gh" = "B-upstream-surfaces"
# The shared drift calculation (DX-drift-core): each helper's first caller is its consumer.
"ddflow/services/drift.py:moved_or_gone" = "PL-staleness"
"ddflow/services/drift.py:decisions_changed" = "DX-sync-command"
"ddflow/services/drift.py:is_covered" = "DX-phase-suite-pass-sha"
"ddflow/services/drift.py:last_seen" = "DX-drift-notice"
"ddflow/services/drift.py:set_last_seen" = "DX-drift-notice"
# The no-key hint for a reviewer listing; DX-reviewers-list-key-hint wires it into api/review.py.
"ddflow/services/review_keys.py:key_hints" = "DX-reviewers-list-key-hint"
# The `pins drivers --check` mergiraf keep/drop evaluation (tests/test_merge_drivers.py pins it).
"ddflow/services/mergedrivers.py:keep_mergiraf" = "B-mergiraf-eval"
# The driver-pack loaders (DRV-packs): `ddflow harness list|show|doctor` reads the layered set
# and modelreg reads the model overlays; the api wiring lands with DRV-migrate.
"ddflow/services/driverpacks.py:model_overlay_paths" = "DRV-migrate"
"ddflow/services/driverpacks.py:load_descriptors" = "DRV-migrate"
"ddflow/services/driverpacks.py:load_pack" = "DRV-migrate"
# The junit-duration rollup for a gate run (PM-test-durations): the runner's pytest/junit
# report feeds it, which the gate pipeline wires when it folds per-test durations into evidence.
"ddflow/services/gates/runner.py:capture_test_durations" = "PM-test-durations"
# The swarm section figures (SW-digest): pure, read-only builders a caller feeds values it
# already read; P-operator-digest renders the section, their first consumer.
"ddflow/services/swarm/digest.py:hedges_from" = "P-operator-digest"
"ddflow/services/swarm/digest.py:spend_usd" = "P-operator-digest"
